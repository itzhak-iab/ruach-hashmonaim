<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול שותפים - עמותת החשמונאים</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
}
.header {
  text-align: center;
  color: white;
  margin-bottom: 30px;
}
.header h1 { font-size: 2rem; margin-bottom: 8px; }
.header p { opacity: 0.85; font-size: 0.95rem; }
.card {
  background: white;
  border-radius: 16px;
  padding: 30px;
  margin-bottom: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}
.login-card { max-width: 450px; margin: 60px auto; text-align: center; }
.login-card h2 { margin-bottom: 20px; color: #333; }
.input-group { margin-bottom: 16px; text-align: right; }
.input-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; font-weight: 600; }
.input-group input, .input-group select {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  font-size: 0.95rem;
  transition: border-color 0.2s;
  direction: ltr;
  text-align: left;
}
.input-group input:focus, .input-group select:focus {
  outline: none;
  border-color: #667eea;
}
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-success { background: #10b981; color: white; }
.btn-success:hover { background: #059669; }
.btn-sm { padding: 8px 16px; font-size: 0.85rem; }

.partners-list { display: grid; gap: 16px; }
.partner-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: #f8fafc;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
  transition: all 0.2s;
}
.partner-item:hover { border-color: #667eea; background: #f0f4ff; }
.partner-item img {
  width: 60px; height: 60px;
  border-radius: 12px;
  object-fit: contain;
  background: white;
  padding: 8px;
  border: 1px solid #e2e8f0;
}
.partner-info { flex: 1; }
.partner-info h3 { font-size: 1rem; color: #1e293b; margin-bottom: 4px; }
.partner-info a { font-size: 0.8rem; color: #667eea; text-decoration: none; direction: ltr; display: inline-block; }
.partner-actions { display: flex; gap: 8px; }
.drag-handle { cursor: grab; color: #94a3b8; font-size: 1.2rem; padding: 0 8px; }
.drag-handle:active { cursor: grabbing; }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; display: none;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white; border-radius: 16px;
  padding: 30px; width: 90%; max-width: 500px;
  max-height: 90vh; overflow-y: auto;
}
.modal h2 { margin-bottom: 20px; color: #333; }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

.status-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: white; padding: 12px 24px;
  border-radius: 12px; font-size: 0.9rem; display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 2000;
}
.status-bar.show { display: block; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.toolbar h2 { color: #1e293b; }

.empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
.empty-state svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.5; }

.img-preview { width: 80px; height: 80px; border-radius: 12px; object-fit: contain; background: #f1f5f9; border: 2px dashed #cbd5e1; display: block; margin: 8px 0; }
.file-input-wrap { position: relative; }
.file-input-wrap input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file-input-label { display: inline-block; padding: 8px 16px; background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 10px; font-size: 0.85rem; color: #64748b; cursor: pointer; text-align: center; width: 100%; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔧 ניהול שותפים</h1>
    <p>עמותת החשמונאים - ממשק ניהול אתר</p>
  </div>

  <!-- Login -->
  <div id="loginSection" class="card login-card">
    <h2>התחברות</h2>
    <p style="color:#64748b; margin-bottom:20px; font-size:0.9rem;">הכנס את הטוקן של GitHub כדי לנהל את השותפים באתר</p>
    <div class="input-group">
      <label>GitHub Token</label>
      <input type="password" id="tokenInput" placeholder="ghp_...">
    </div>
    <button class="btn btn-primary" onclick="login()" style="width:100%;">כניסה</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none;">
    <div class="card">
      <div class="toolbar">
        <h2>השותפים שלנו (‎<span id="partnerCount">0</span>)</h2>
        <button class="btn btn-success" onclick="openAddModal()">+ הוסף שותף</button>
      </div>
      <div id="partnersList" class="partners-list"></div>
    </div>
    <div style="text-align:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="saveChanges()" id="saveBtn" style="display:none;">💾 שמור שינויים לאתר</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">הוסף שותף חדש</h2>
    <div class="input-group">
      <label>שם השותף (עברית)</label>
      <input type="text" id="partnerName" placeholder="שם השותף" style="direction:rtl; text-align:right;">
    </div>
    <div class="input-group">
      <label>שם השותף (English) - אופציונלי</label>
      <input type="text" id="partnerNameEn" placeholder="Partner name">
    </div>
    <div class="input-group">
      <label>קישור לאתר</label>
      <input type="url" id="partnerUrl" placeholder="https://...">
    </div>
    <div class="input-group">
      <label>לוגו</label>
      <img id="imgPreview" class="img-preview" src="" style="display:none;">
      <div class="file-input-wrap">
        <span class="file-input-label">📁 בחר קובץ תמונה (PNG, SVG, JPG)</span>
        <input type="file" id="partnerLogo" accept="image/*" onchange="previewImage(this)">
      </div>
      <div style="margin-top:8px; font-size:0.8rem; color:#94a3b8;">או הכנס URL ישיר:</div>
      <input type="text" id="partnerLogoUrl" placeholder="images/partner-..." style="margin-top:4px;">
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="savePartner()" id="modalSaveBtn">הוסף</button>
      <button class="btn" style="background:#e2e8f0;" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<div class="status-bar" id="statusBar"></div>

<script>
let token = '';
let partners = [];
let currentSha = '';
let editIndex = -1;
let hasChanges = false;
const REPO = 'itzhak-iab/ruach-hashmonaim';

function showStatus(msg, duration=3000) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.classList.add('show');
  setTimeout(() => bar.classList.remove('show'), duration);
}

async function login() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return showStatus('⚠️ הכנס טוקן');
  showStatus('מתחבר...');
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`, {
      headers: { 'Authorization': `token ${token}` }
    });
    if (!res.ok) throw new Error('טוקן לא תקין');
    const data = await res.json();
    currentSha = data.sha;
    const content = atob(data.content.replace(/\n/g, ''));
    parsePartners(content);
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderPartners();
    showStatus('✅ התחברת בהצלחה!');
  } catch(e) {
    showStatus('❌ ' + e.message);
  }
}

function parsePartners(html) {
  partners = [];
  const regex = /<a href="([^"]+)" class="partner-3d-card"[^>]*>\s*<div class="partner-3d-logo">\s*<img src="([^"]+)" alt="([^"]+)"[^>]*>\s*<\/div>\s*<span class="partner-3d-name he-only">([^<]*)<\/span>\s*<span class="partner-3d-name en-only">([^<]*)<\/span>\s*<\/a>/g;
  let match;
  const seen = new Set();
  while ((match = regex.exec(html)) !== null) {
    const key = match[2]+match[3];
    if (seen.has(key)) continue;
    seen.add(key);
    partners.push({
      url: match[1].trim(),
      img: match[2],
      alt: match[3],
      nameHe: match[4],
      nameEn: match[5]
    });
  }
  document.getElementById('partnerCount').textContent = partners.length;
}

function renderPartners() {
  const list = document.getElementById('partnersList');
  if (partners.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>אין שותפים עדיין</p></div>';
    return;
  }
  list.innerHTML = partners.map((p, i) => `
    <div class="partner-item" draggable="true" ondragstart="dragStart(event,${i})" ondragover="dragOver(event)" ondrop="drop(event,${i})">
      <span class="drag-handle">⠿</span>
      <img src="https://chashmonayim.org/${p.img}" alt="${p.alt}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2260%22 x=%2225%22 font-size=%2240%22>🏢</text></svg>'">
      <div class="partner-info">
        <h3>${p.nameHe || p.alt}</h3>
        <a href="${p.url}" target="_blank">${p.url.replace(/https?:\/\//, '').substring(0, 40)}</a>
      </div>
      <div class="partner-actions">
        <button class="btn btn-sm" style="background:#e2e8f0;" onclick="editPartner(${i})">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deletePartner(${i})">🗑️</button>
      </div>
    </div>
  `).join('');
  document.getElementById('partnerCount').textContent = partners.length;
}

let dragIdx = -1;
function dragStart(e, i) { dragIdx = i; e.dataTransfer.effectAllowed = 'move'; }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function drop(e, i) {
  e.preventDefault();
  if (dragIdx === i) return;
  const item = partners.splice(dragIdx, 1)[0];
  partners.splice(i, 0, item);
  renderPartners();
  markChanged();
}

function openAddModal() {
  editIndex = -1;
  document.getElementById('modalTitle').textContent = 'הוסף שותף חדש';
  document.getElementById('modalSaveBtn').textContent = 'הוסף';
  document.getElementById('partnerName').value = '';
  document.getElementById('partnerNameEn').value = '';
  document.getElementById('partnerUrl').value = '';
  document.getElementById('partnerLogoUrl').value = '';
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('modal').classList.add('active');
}

function editPartner(i) {
  editIndex = i;
  const p = partners[i];
  document.getElementById('modalTitle').textContent = 'ערוך שותף';
  document.getElementById('modalSaveBtn').textContent = 'שמור';
  document.getElementById('partnerName').value = p.nameHe || p.alt;
  document.getElementById('partnerNameEn').value = p.nameEn || '';
  document.getElementById('partnerUrl').value = p.url;
  document.getElementById('partnerLogoUrl').value = p.img;
  const preview = document.getElementById('imgPreview');
  preview.src = `https://chashmonayim.org/${p.img}`;
  preview.style.display = 'block';
  document.getElementById('modal').classList.add('active');
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }

function previewImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('imgPreview').src = e.target.result;
      document.getElementById('imgPreview').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function savePartner() {
  const name = document.getElementById('partnerName').value.trim();
  const nameEn = document.getElementById('partnerNameEn').value.trim();
  const url = document.getElementById('partnerUrl').value.trim();
  let img = document.getElementById('partnerLogoUrl').value.trim();
  const fileInput = document.getElementById('partnerLogo');

  if (!name) return showStatus('⚠️ הכנס שם שותף');
  if (!url) return showStatus('⚠️ הכנס קישור');

  // Upload image if file selected
  if (fileInput.files && fileInput.files[0]) {
    showStatus('מעלה תמונה...');
    const file = fileInput.files[0];
    const ext = file.name.split('.').pop();
    const imgName = `images/partner-${Date.now()}.${ext}`;
    const base64 = await fileToBase64(file);
    
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${imgName}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Add partner logo: ${name}`, content: base64 })
      });
      if (!res.ok) throw new Error('שגיאה בהעלאת התמונה');
      img = imgName;
    } catch(e) {
      return showStatus('❌ ' + e.message);
    }
  }

  if (!img) return showStatus('⚠️ בחר תמונה או הכנס נתיב');

  const partner = { url, img, alt: name, nameHe: name, nameEn };
  if (editIndex >= 0) {
    partners[editIndex] = partner;
  } else {
    partners.push(partner);
  }
  
  closeModal();
  renderPartners();
  markChanged();
  showStatus(editIndex >= 0 ? '✅ שותף עודכן' : '✅ שותף נוסף');
}

function deletePartner(i) {
  if (!confirm(`למחוק את "${partners[i].nameHe || partners[i].alt}"?`)) return;
  partners.splice(i, 1);
  renderPartners();
  markChanged();
  showStatus('🗑️ שותף הוסר');
}

function markChanged() {
  hasChanges = true;
  document.getElementById('saveBtn').style.display = 'inline-block';
}

async function saveChanges() {
  if (!hasChanges) return;
  showStatus('שומר שינויים...', 10000);
  
  try {
    // Fetch current file
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`, {
      headers: { 'Authorization': `token ${token}` }
    });
    const data = await res.json();
    currentSha = data.sha;
    let html = atob(data.content.replace(/\n/g, ''));
    
    // Build new partners HTML
    const partnersHtml = partners.map(p => `
          <a href="${p.url}" class="partner-3d-card" target="_blank" rel="noopener">
            <div class="partner-3d-logo">
              <img src="${p.img}" alt="${p.alt}" loading="lazy">
            </div>
            <span class="partner-3d-name he-only">${p.nameHe}</span>
            <span class="partner-3d-name en-only">${p.nameEn || ''}</span>
          </a>`).join('\n');
    
    // Duplicate for seamless marquee
    const trackContent = partnersHtml + '\n' + partnersHtml;
    
    // Replace the marquee track content
    const trackStart = html.indexOf('<div class="partners-marquee-track">');
    const trackInner = html.indexOf('>', trackStart) + 1;
    const trackEnd = html.indexOf('</div>', trackInner);
    
    // Find the correct closing div (the one that closes the track)
    let depth = 1;
    let pos = trackInner;
    while (depth > 0 && pos < html.length) {
      const nextOpen = html.indexOf('<div', pos);
      const nextClose = html.indexOf('</div>', pos);
      if (nextClose === -1) break;
      if (nextOpen !== -1 && nextOpen < nextClose) {
        depth++;
        pos = nextOpen + 4;
      } else {
        depth--;
        if (depth === 0) {
          html = html.substring(0, trackInner) + '\n' + trackContent + '\n        ' + html.substring(nextClose);
          break;
        }
        pos = nextClose + 6;
      }
    }
    
    // Upload
    const encoded = btoa(unescape(encodeURIComponent(html)));
    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: 'Update partners via admin panel',
        content: encoded,
        sha: currentSha
      })
    });
    
    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || 'שגיאה בשמירה');
    }
    
    hasChanges = false;
    document.getElementById('saveBtn').style.display = 'none';
    showStatus('✅ השינויים נשמרו באתר בהצלחה!');
  } catch(e) {
    showStatus('❌ ' + e.message);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Auto-login if token in URL hash
if (window.location.hash) {
  document.getElementById('tokenInput').value = window.location.hash.substring(1);
  login();
}
</script>
</body>
</html>
